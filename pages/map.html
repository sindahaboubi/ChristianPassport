<div class="map-card">
  <!-- DANISH FLAG WATERMARK -->
  <div class="dk-flag-watermark">
    <svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
      <rect width="900" height="600" fill="#C60C30"/>
      <rect x="250" y="0" width="120" height="600" fill="white"/>
      <rect x="0" y="240" width="900" height="120" fill="white"/>
    </svg>
  </div>

  <!-- HOLOGRAM -->
  <div class="hologram-overlay"></div>

  <!-- MAP HEADER -->
  <div class="map-header">
    <div class="map-title">Destinations</div>
    <div class="map-subtitle">Countries I Have Visited</div>
    <div class="map-count"><span>13</span> countries & counting...</div>
  </div>

  <!-- MAP BODY (LEAFLET MAP) -->
  <div class="map-body-real">
    <div id="leaflet-map" style="width: 100%; height: 100%; border-radius: 4px; z-index: 1;"></div>
  </div>

  <!-- QUOTE -->
  <div class="map-quote">
    "The world is not just a place to see, but a story waiting to be lived"
  </div>
</div>
</div>
